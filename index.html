    <link rel="stylesheet" href="https://unpkg.com/@livekit/components-styles/dist/general/index.css">
    <script>
      (function() {
        try {
          // Force light theme for consistent colors across all browsers
          var savedTheme = 'light';
          localStorage.setItem('app-theme', 'light');
          document.documentElement.setAttribute('data-theme', 'light');
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', '#f5f3ff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        :root {
          --loader-bg: #0f172a;
          --loader-text: #fff;
          --loader-ring: #8b5cf6;
          --loader-border: rgba(255, 255, 255, 0.1);
        }
        :root[data-theme='light'] {
          --loader-bg: #F5F3FF;
          --loader-text: #2e1065;
          --loader-ring: #7c3aed;
          --loader-border: rgba(124, 58, 237, 0.15);
        }
        .initial-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: var(--loader-bg);
          color: var(--loader-text);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 4px solid var(--loader-border);
          border-left-color: var(--loader-ring);
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader"></div>
        <div style="font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px;">Bondle Yükleniyor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
